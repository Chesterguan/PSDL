    <text style="fill: #1f2430; font: 700 8.8px 'DejaVu Sans'; text-anchor: start" x="18.918" y="221.42016" transform="rotate(-0 18.918 221.42016)">Defects caught by earlier iterations of this audit:</text>
   </g>
