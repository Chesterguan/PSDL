# PSDL Example: Sepsis Screening (qSOFA + Lactate)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Implements qSOFA (quick Sequential Organ Failure Assessment)
# combined with lactate-based sepsis screening.
#
# qSOFA Criteria (2+ = positive screen):
# - Respiratory rate >=22/min
# - Altered mental status (GCS <15)
# - Systolic BP <=100 mmHg
#
# Reference: Singer et al. JAMA 2016 (Sepsis-3)

psdl_version: "0.5"

scenario:
  name: Sepsis_Screening_v1
  version: "1.1.0"
  description: "Sepsis screening using qSOFA criteria and lactate"
  tags:
    - sepsis
    - qsofa
    - critical-care
    - emergency

# ── Audit Block ──────────────────────────────────
audit:
  intent: "Screen for sepsis using qSOFA criteria combined with lactate"
  rationale: "Early sepsis identification enables timely antibiotics and resuscitation"
  provenance:
    type: publication
    reference: "Singer et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3)"
    uri: "https://doi.org/10.1001/jama.2016.0287"
    version: "JAMA 2016"

# ── Population ───────────────────────────────────
population:
  include:
    - age >= 18
    - location IN ["ED", "ICU", "Ward"]
  exclude:
    - status == "comfort_care_only"

# ── Signal References (v0.3: abstract refs only) ─
signals:
  RR:
    ref: respiratory_rate
    expected_unit: breaths/min
    description: "Respiratory rate"

  SBP:
    ref: systolic_bp
    expected_unit: mmHg
    description: "Systolic blood pressure"

  HR:
    ref: heart_rate
    expected_unit: bpm
    description: "Heart rate"

  Temp:
    ref: temperature
    expected_unit: celsius
    description: "Body temperature"

  GCS:
    ref: glasgow_coma_scale
    expected_type: numeric
    description: "Glasgow Coma Scale score"

  Lact:
    ref: lactate
    expected_unit: mmol/L
    description: "Blood lactate"

  WBC:
    ref: white_blood_cell_count
    expected_unit: 10^9/L
    description: "White blood cell count"

  Plt:
    ref: platelets
    expected_unit: 10^9/L
    description: "Platelet count"

  Cr:
    ref: creatinine
    expected_unit: mg/dL
    description: "Serum creatinine"

# ── Trends (v0.3: numeric values only) ───────────
trends:
  rr_current:
    type: float
    expr: last(RR)
    description: "Current respiratory rate"

  sbp_current:
    type: float
    expr: last(SBP)
    description: "Current systolic BP"

  hr_current:
    type: float
    expr: last(HR)
    description: "Current heart rate"

  temp_current:
    type: float
    expr: last(Temp)
    description: "Current temperature"

  gcs_current:
    type: float
    expr: last(GCS)
    description: "Current GCS score"

  lact_current:
    type: float
    expr: last(Lact)
    description: "Current lactate"

  lact_slope_2h:
    type: float
    unit: mmol/L/s
    expr: slope(Lact, 2h)
    description: "Lactate slope over 2 hours (slope is per second)"

  wbc_current:
    type: float
    expr: last(WBC)
    description: "Current WBC count"

  plt_current:
    type: float
    expr: last(Plt)
    description: "Current platelet count"

  cr_delta_24h:
    type: float
    expr: delta(Cr, 24h)
    description: "Creatinine change over 24 hours"

# ── Logic (v0.3: 'when' with comparisons) ────────
logic:
  # qSOFA components
  tachypnea:
    when: rr_current >= 22
    description: "Respiratory rate >=22/min (qSOFA criterion)"

  hypotension:
    when: sbp_current <= 100
    description: "Systolic BP <=100 mmHg (qSOFA criterion)"

  altered_mental_status:
    when: gcs_current < 15
    description: "GCS <15 (qSOFA criterion)"

  # Lactate criteria
  lactate_elevated:
    when: lact_current > 2.0
    description: "Lactate >2.0 mmol/L"

  lactate_high:
    when: lact_current > 4.0
    description: "Lactate >4.0 mmol/L (severe)"

  # slope() is per second: 1e-4 mmol/L/s ~= 0.36 mmol/L/h
  lactate_rising:
    when: lact_slope_2h > 0.0001
    description: "Rapidly rising lactate (>~0.36 mmol/L/h)"

  # SIRS criteria (Bone et al. 1992: temp >38.0 or <36.0, HR >90,
  # RR >20, WBC >12 or <4 x10^9/L; positive = any 2 of the 4)
  fever:
    when: temp_current > 38.0
    description: "Temperature >38.0C (SIRS)"

  hypothermia:
    when: temp_current < 36.0
    description: "Temperature <36.0C (SIRS)"

  tachycardia:
    when: hr_current > 90
    description: "Heart rate >90 bpm (SIRS)"

  tachypnea_sirs:
    when: rr_current > 20
    description: "Respiratory rate >20/min (SIRS threshold, distinct from qSOFA >=22)"

  leukocytosis:
    when: wbc_current > 12.0
    description: "WBC >12.0 x10^9/L (SIRS)"

  leukopenia:
    when: wbc_current < 4.0
    description: "WBC <4.0 x10^9/L (SIRS)"

  # Organ dysfunction markers
  thrombocytopenia:
    when: plt_current < 100
    description: "Platelets <100 x10^9/L"

  aki_marker:
    when: cr_delta_24h > 0.5
    description: "Creatinine rise >0.5 in 24h"

  # qSOFA scoring: any 1 / any 2 / all 3 of the three criteria
  qsofa_1:
    when: tachypnea OR hypotension OR altered_mental_status
    severity: low
    description: "qSOFA >=1 criterion"

  qsofa_2:
    when: (tachypnea AND hypotension) OR (tachypnea AND altered_mental_status) OR (hypotension AND altered_mental_status)
    severity: medium
    description: "qSOFA >=2 of 3 criteria - positive screen"

  qsofa_3:
    when: tachypnea AND hypotension AND altered_mental_status
    severity: high
    description: "qSOFA 3/3 criteria - high risk"

  # SIRS positive: any 2 of the 4 criterion groups
  # (temperature, heart rate, respiratory rate, WBC)
  sirs_temp:
    when: fever OR hypothermia
    description: "SIRS temperature criterion"

  sirs_wbc:
    when: leukocytosis OR leukopenia
    description: "SIRS WBC criterion"

  sirs_positive:
    when: (sirs_temp AND tachycardia) OR (sirs_temp AND tachypnea_sirs) OR (sirs_temp AND sirs_wbc) OR (tachycardia AND tachypnea_sirs) OR (tachycardia AND sirs_wbc) OR (tachypnea_sirs AND sirs_wbc)
    severity: medium
    description: "SIRS positive: >=2 of 4 criteria"

  # Combined sepsis screening
  sepsis_screen_positive:
    when: qsofa_2 AND lactate_elevated
    severity: high
    description: "Sepsis screen positive - qSOFA >=2 + elevated lactate"

  # Septic shock surrogate. Sepsis-3 defines septic shock as vasopressor
  # requirement to keep MAP >=65 plus lactate >2 despite adequate fluid
  # resuscitation; medication and fluid signals are not modeled here, so
  # persistent hypotension + severe hyperlactatemia serves as a surrogate.
  septic_shock:
    when: sepsis_screen_positive AND hypotension AND lactate_high
    severity: critical
    description: "Septic shock surrogate: positive screen + hypotension + lactate >4"

  # Deteriorating sepsis
  sepsis_worsening:
    when: sepsis_screen_positive AND lactate_rising
    severity: critical
    description: "Sepsis with worsening trajectory"

  # Multi-organ dysfunction
  multi_organ_dysfunction:
    when: sepsis_screen_positive AND (thrombocytopenia OR aki_marker)
    severity: critical
    description: "Sepsis with multi-organ dysfunction"

  # Early warning
  infection_possible:
    when: (fever OR hypothermia) AND (tachycardia AND tachypnea)
    severity: low
    description: "Possible infection - monitor closely"

# ── Outputs ──────────────────────────────────────
outputs:
  decision:
    sepsis_positive:
      type: boolean
      from: logic.sepsis_screen_positive
      description: "Sepsis screen positive"
    septic_shock:
      type: boolean
      from: logic.septic_shock
      description: "Septic shock present"
  features:
    lact_current:
      type: float
      from: trends.lact_current
      unit: mmol/L
    # Note: a numeric qSOFA score (0-3) is intentionally NOT declared —
    # PSDL logic composes booleans and has no criterion-counting
    # primitive; the qsofa_1/2/3 decision nodes cover the score bands.
